<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>churvey setup</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="lead" id="intro"></p>
  <div id="rows"></div>
  <section class="panel" id="test-panel">
    <h2 id="test-title" style="margin-top:0"></h2>
    <p id="test-intro"></p>
    <div class="toolbar">
      <button class="primary" id="test-btn"></button>
      <button id="done-btn"></button>
      <span class="status-line" id="test-state"></span>
    </div>
    <ul class="results" id="results"></ul>
  </section>
  <section class="panel" id="done-panel" hidden>
    <h2 id="done-title" style="margin-top:0"></h2>
    <p id="done-text"></p>
    <pre class="next" id="next"></pre>
  </section>
</main>
<script src="setup.js"></script>
</body>
</html>
