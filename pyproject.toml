[project]
name = "churvey"
version = "0.1.0"
description = "Chatbot survey tooling: the Firefox probe extension (ff/), its zero-click launcher and remote control."
requires-python = ">=3.9"
dependencies = []  # stdlib only

[project.scripts]
churvey = "churvey.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["churvey"]

[tool.hatch.build.targets.wheel.force-include]
"ff" = "churvey/survey/_ff"
"schema/questions.schema.json" = "churvey/schema/questions.schema.json"

[dependency-groups]
dev = [
    "quickjs>=1.19.4",
]
