[project]
name = "churvey"
version = "0.1.0"
description = "Chatbot survey tooling: the Firefox probe extension (ff/), its zero-click launcher and remote control."
requires-python = ">=3.9"
dependencies = []  # stdlib only

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["churvey"]

[tool.hatch.build.targets.wheel.force-include]
"ff" = "churvey/survey/_ff"
